Rules:
- AbortIncompleteMultipartUpload:
    DaysAfterInitiation: 7
  Expiration:
    Days: 365
  Filter:
    Prefix: AWSLogs/802807423235/
  ID: one-year retention
  NoncurrentVersionExpiration:
    NoncurrentDays: 1
