AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Lifecycle rules for Control Tower Log Archive buckets

Parameters:
  LogBucketName:
    Type: String
    Description: Main Control Tower logs bucket
  AccessLogBucketName:
    Type: String
    Description: Control Tower S3 access logs bucket
  LogBucketExpirationInDays:
    Type: Number
    Default: 365
    Description: Log bucket expiration in days
  AccessLogBucketExpirationInDays:
    Type: Number
    Default: 730
    Description: Access log bucket expiration in days
  NoncurrentVersionExpirationInDays:
    Type: Number
    Default: 1
    Description: Noncurrent version expiration in days

Resources:
  LogBucketLifecycle:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref LogBucketName
      LifecycleConfiguration:
        Rules:
        - Id: RetentionRule
          Status: Enabled
          Filter:
            Prefix: ""
          ExpirationInDays: !Ref LogBucketExpirationInDays
          NoncurrentVersionExpiration:
            NoncurrentDays: !Ref NoncurrentVersionExpirationInDays
        - Id: abort-incomplete-multipart
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 7
        - Id: delete-markers-cleanup
          Status: Enabled
          Expiration:
            ExpiredObjectDeleteMarker: true

  AccessLogBucketLifecycle:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref AccessLogBucketName
      LifecycleConfiguration:
        Rules:
        - Id: RetentionRule
          Status: Enabled
          Filter:
            Prefix: ""
          ExpirationInDays: !Ref AccessLogBucketExpirationInDays
          NoncurrentVersionExpiration:
            NoncurrentDays: !Ref NoncurrentVersionExpirationInDays
        - Id: abort-incomplete-multipart
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 7
        - Id: delete-markers-cleanup
          Status: Enabled
          Expiration:
            ExpiredObjectDeleteMarker: true
