---
#Default region for deploying Custom Control Tower: Code Pipeline, Step functions, Lambda, SSM parameters, and StackSets
region: eu-west-1 # Control Tower Home Region
version: 2021-03-15

resources:
  - name: test-preventive-guardrails
    description: Control Tower Custom Service Control Policies - Additional Preventive Guardrails. To prevent from deleting or disabling resources in member accounts
    resource_file: policies/preventive-guardrails.json
    deploy_method: scp
    deployment_targets:
      organizational_units:
        - Security # Formerly Core
        - Research

  - name: describe-regions-iam-role
    description: Control Tower Custom CloudFormation Resources - Create Additional IAM Role
    resource_file: templates/describe-regions-iam-role.template
    parameters:
      - parameter_key: dummyParameter
        parameter_value: dummyValue
    deploy_method: stack_set
    deployment_targets:
      organizational_units:
        - Research
        - Sandbox # Formerly Custom
    regions:
      - eu-west-1

  - name: access-keys-rotated
    description: Control Tower Config Rule - Additional Detective Guardrails
    resource_file: templates/access-keys-rotated.template
    parameters:
      - parameter_key: maxAccessKeyAge
        parameter_value: 90
    deploy_method: stack_set
    deployment_targets:
      organizational_units:
        - Research
    regions:
      - eu-west-1

  - name: s3-lifecycle-configuration
    description: Control Tower Automation - Lifecycle Configuration Re-enforcer
    resource_file: templates/s3-lifecycle-configuration.template
    parameters:
      - parameter_key: LogBucketName
        parameter_value: aws-controltower-logs-640693977485-eu-west-1
      - parameter_key: AccessLogBucketName
        parameter_value: aws-controltower-s3-access-logs-640693977485-eu-west-1
      - parameter_key: ExpirationInDays
        parameter_value: 365
      - parameter_key: NoncurrentVersionExpirationInDays
        parameter_value: 1
      - parameter_key: AbortIncompleteMultipartUploadDays
        parameter_value: 7
      - parameter_key: RulesTemplateURL
        parameter_value: https://customizationsforctsolut-customcontroltowerpipeli-fx7pz8rmcvqx.s3.eu-west-1.amazonaws.com/_custom_ct_templates_staging/templates/s3-lifecycle-rules.template
    deploy_method: stack_set
    deployment_targets:
      accounts:
        - Log Archive
    regions:
      - eu-west-1
