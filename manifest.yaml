---
#Default region for deploying Custom Control Tower: Code Pipeline, Step functions, Lambda, SSM parameters, and StackSets
region: eu-west-1 # Control Tower Home Region
version: 2020-01-01

# Control Tower Custom Service Control Policies - Additional Preventive Guardrails
organization_policies:
  - name: test-preventive-guardrails
    description: To prevent from deleting or disabling resources in member accounts
    policy_file: policies/preventive-guardrails.json
    #Apply to the following OU(s)
    apply_to_accounts_in_ou: # :type: list
      - Security # Formerly Core
      - Research

# Control Tower Custom CloudFormation Resources - Create Additional IAM Role
cloudformation_resources:
  - name: stackset-1
    template_file: templates/describe-regions-iam-role.template
    parameter_file: parameters/describe-regions-iam-role.json
    deploy_method: stack_set
    deploy_to_ou: # :type: list
      - Research
      - Sandbox # Formerly Custom
    regions:
      - eu-west-1

  # Control Tower Config Rule - Additional Detective Guardrails
  - name: stackset-2
    template_file: templates/access_keys_rotated.template
    parameter_file: parameters/access_keys_rotated.json
    deploy_method: stack_set
    deploy_to_ou: # :type: list
      - Research
    regions:
      - eu-west-1

  # Control Tower Automation - Lifecycle Configuration Re-enforcer
  - name: s3-lifecycle-configuration
    template_file: templates/s3-lifecycle-configuration.template
    parameter_file: parameters/s3-lifecycle-configuration.json
    deploy_method: stack_set
    deployment_targets:
      accounts:
        - Log Archive # Directing target execution directly inside the Log Archive sub-account
    regions:
      - eu-west-1
